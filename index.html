<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>TusDostum</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="TusDostum">
<meta name="application-name" content="TusDostum">
<meta name="theme-color" content="#0D7A64">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first app shell — bottom tab bar and bottom sheets under 760px, centered dialogs above.
   Study TYPE = small square + word (konu / tekrar / soru). SUBJECT = icon badge in its own color + name. Color never stands alone. */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --surface-2: #E8EEEC;
  --ink: #13211F;
  --muted: #56655F;
  --line: #D8E1DF;
  --accent: #0D7A64;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFEA;
  --konu: #0D7A64;
  --tekrar: #B86410;
  --soru: #4B48D6;
  --ok: #1F8A4C;
  --bad: #C0392F;
  --warn-bg: #FFF4E0;
  --warn-ink: #7A4A06;
  --scrim: rgba(8,16,15,.45);
  --shadow: 0 1px 2px rgba(19,33,31,.06), 0 8px 24px rgba(19,33,31,.08);
  /* Ders renkleri (12 kategorik renk, açık tema; doğrulandı: komşu çiftlerde CVD ΔE ≥ 11) */
  --d-anatomi: #d64545; --d-fizyoloji: #2a78d6; --d-histoloji: #c2408a; --d-biyokimya: #c98500;
  --d-mikrobiyoloji: #138a72; --d-patoloji: #6a4fd6; --d-farmakoloji: #e0662e; --d-dahiliye: #0e8fb5;
  --d-pediatri: #6e9a14; --d-cerrahi: #b3264e; --d-kadin: #d86aa8; --d-kucuk: #9a6a2a;
  --nav-h: 56px;
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1514; --surface: #13201E; --surface-2: #1A2A27; --ink: #E4EEEB; --muted: #9DB0AB;
    --line: #243632; --accent: #3BC4A2; --accent-ink: #07211B; --accent-soft: #163A32;
    --konu: #3BC4A2; --tekrar: #F0A24E; --soru: #8D8CF7; --ok: #4CC47E; --bad: #F07A70;
    --warn-bg: #3A2A10; --warn-ink: #F6D29A; --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
    --d-anatomi: #e05555; --d-fizyoloji: #3f88e8; --d-histoloji: #d0549c; --d-biyokimya: #b88000;
    --d-mikrobiyoloji: #1fa07e; --d-patoloji: #8a76ee; --d-farmakoloji: #e0702f; --d-dahiliye: #1a9cc6;
    --d-pediatri: #7ea51c; --d-cerrahi: #c8305a; --d-kadin: #c86fb4; --d-kucuk: #b07a2e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1514; --surface: #13201E; --surface-2: #1A2A27; --ink: #E4EEEB; --muted: #9DB0AB;
  --line: #243632; --accent: #3BC4A2; --accent-ink: #07211B; --accent-soft: #163A32;
  --konu: #3BC4A2; --tekrar: #F0A24E; --soru: #8D8CF7; --ok: #4CC47E; --bad: #F07A70;
  --warn-bg: #3A2A10; --warn-ink: #F6D29A; --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  --d-anatomi: #e05555; --d-fizyoloji: #3f88e8; --d-histoloji: #d0549c; --d-biyokimya: #b88000;
  --d-mikrobiyoloji: #1fa07e; --d-patoloji: #8a76ee; --d-farmakoloji: #e0702f; --d-dahiliye: #1a9cc6;
  --d-pediatri: #7ea51c; --d-cerrahi: #c8305a; --d-kadin: #c86fb4; --d-kucuk: #b07a2e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: pan-x pan-y; overscroll-behavior: none; }
/* Uygulama hissi: arayüz metni seçilmez, uzun basınca baloncuk çıkmaz; yazı alanları hariç */
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
input, textarea, select { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
html.lock, html.lock body { overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button, a, select, input, label { touch-action: manipulation; }
button { cursor: pointer; user-select: none; -webkit-user-select: none; }
button:disabled, select:disabled, input:disabled { cursor: not-allowed; opacity: .55; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sheet:focus { outline: none; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.blk { display: block; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
@media (max-height: 480px) { header.top { position: static; } }
.top-row { display: flex; align-items: center; gap: 8px; padding-block: 10px 6px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 20px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; flex: none; display: block; }
.brand-mark svg { width: 100%; height: 100%; display: block; }
.top-spacer { flex: 1; }
.online-chip { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 12px 4px 6px; font-size: 13px; color: var(--muted); min-height: 44px; min-width: 44px; white-space: nowrap; }
.online-chip .stack { display: flex; }
.online-chip .stack .av { margin-left: -6px; border: 2px solid var(--bg); }
.online-chip .stack .av:first-child { margin-left: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; flex: none; }
.dot.off { background: var(--line); }
.dot.pause { background: var(--tekrar); }
.dot.away { background: var(--ok); opacity: .45; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 12px; font-size: 14px; font-weight: 600; min-height: 44px; min-width: 44px; }
.icon-btn svg { width: 20px; height: 20px; flex: none; }
@media (max-width: 420px) { .icon-btn .lbl { display: none; } .icon-btn { padding: 0; } .online-chip .stack { display: none; } .online-chip { padding: 4px 12px; } }
@media (max-width: 350px) { .brand-name { display: none; } }

nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 10px 14px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 6px; position: relative; min-height: 44px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab svg { width: 22px; height: 22px; display: none; }
.tab .count { font-family: var(--f-mono); font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 0 6px; line-height: 18px; }

main { padding-block: 20px 48px; display: grid; gap: 16px; }
main > section { min-width: 0; }

@media (max-width: 760px) {
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: grid; grid-template-columns: repeat(5, 1fr); gap: 0;
    background: var(--surface); border-top: 1px solid var(--line); overflow: visible;
    padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tab { flex-direction: column; justify-content: center; gap: 2px; font-size: 12px; padding: 6px 2px 4px; border-bottom: 0; white-space: nowrap; line-height: 1.2; height: var(--nav-h); }
  .tab[aria-selected="true"] { color: var(--accent); }
  .tab svg { display: block; width: 21px; height: 21px; }
  .tab .count { position: absolute; top: 4px; left: calc(50% + 6px); }
  main { padding-bottom: calc(var(--nav-h) + max(8px, env(safe-area-inset-bottom, 0px)) + 24px); }
  body.has-strip main { padding-bottom: calc(var(--nav-h) + max(8px, env(safe-area-inset-bottom, 0px)) + 88px); }
  .brand { font-size: 18px; }
}

.banner { border-radius: 12px; padding: 10px 14px; background: var(--warn-bg); color: var(--warn-ink); font-size: 14px; margin-bottom: 10px; }
.banner .row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
@media (max-width: 480px) { .panel { padding: 14px; border-radius: 14px; } }
.panel h2 { font-size: 18px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.stack-gap { display: grid; gap: 12px; }
.desk-only { display: block; }
.mob-only { display: none; }
@media (max-width: 760px) { .desk-only { display: none !important; } .mob-only { display: block; } }

/* Ders rozeti */
.sb { --c: var(--accent); width: 32px; height: 32px; border-radius: 9px; flex: none; display: inline-grid; place-items: center;
  background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent); }
.sb svg { width: 20px; height: 20px; display: block; }
.sb.sm { width: 24px; height: 24px; border-radius: 7px; }
.sb.sm svg { width: 15px; height: 15px; }
.sb.lg { width: 42px; height: 42px; border-radius: 12px; }
.sb.lg svg { width: 26px; height: 26px; }
.chip-s { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); white-space: nowrap; }
.chip-s .muted { font-variant-numeric: tabular-nums; }

/* Kronometre */
.today-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .today-grid { grid-template-columns: minmax(0, 1fr); } }
.timer-card { box-shadow: var(--shadow); }
.field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
select, input[type="number"], input[type="date"], input[type="text"], textarea {
  width: 100%; min-height: 46px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 11px; font-weight: 500; color: var(--ink); font-size: 16px;
}
.subj-pick { display: flex; gap: 10px; align-items: center; }
.subj-pick select { flex: 1; min-width: 0; }
.locked { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 11px; min-height: 46px; font-weight: 600; color: var(--ink); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 8px 6px; min-height: 40px; font-weight: 600; font-size: 14px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg button[aria-checked="true"]:disabled { opacity: 1; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.tdot { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; }
.t-konu { background: var(--konu); } .t-tekrar { background: var(--tekrar); } .t-soru { background: var(--soru); }
.clock { font-family: var(--f-mono); font-weight: 600; font-size: clamp(44px, 12vw, 68px); letter-spacing: -0.03em; text-align: center; padding-block: 8px 2px; font-variant-numeric: tabular-nums; user-select: none; -webkit-user-select: none; }
.clock.brk { color: var(--tekrar); }
.clock-seg { text-align: center; font-family: var(--f-mono); font-weight: 600; font-size: 19px; color: var(--accent); font-variant-numeric: tabular-nums; }
.clock-seg span { font-family: var(--f-body); font-weight: 600; font-size: 13px; color: var(--muted); margin-right: 8px; }
.clock-alt { text-align: center; font-family: var(--f-mono); font-size: 14px; color: var(--muted); min-height: 21px; font-variant-numeric: tabular-nums; }
.clock-sub { text-align: center; font-size: 13px; color: var(--muted); min-height: 20px; margin-top: 2px; }
.tc-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 18px; font-weight: 700; font-size: 15px; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding: 0 12px; min-height: 44px; }
.btn.sm { min-height: 44px; padding: 0 14px; font-size: 14px; }
.btn:active:not(:disabled), .icon-btn:active, .online-chip:active, .subj:active, button.person:active, button.rank-row:active { filter: brightness(.94); }
@media (hover: hover) {
  .btn:hover:not(:disabled), .icon-btn:hover { background: var(--surface-2); }
  .btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.06); }
  .btn.ghost:hover:not(:disabled) { background: var(--accent-soft); }
}
.status-pill { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.status-pill.live { background: var(--accent-soft); color: var(--accent); }
.status-pill.pause { background: var(--warn-bg); color: var(--warn-ink); }
.lock-note { text-align: center; font-size: 13px; color: var(--muted); margin-top: 2px; }
.nudge { background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; margin-top: 12px; text-align: center; }

.kpis { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.kpi { background: var(--bg); border-radius: 12px; padding: 12px; min-width: 0; }
.kpi .v { font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 600; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.side-note { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; }
.exam { display: flex; align-items: center; gap: 14px; }
.exam .big { font-family: var(--f-display); font-size: 34px; font-weight: 700; line-height: 1; }

/* Takvim */
.heat { display: grid; gap: 3px; justify-content: start; }
.heat .ml { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: visible; height: 16px; line-height: 16px; }
.heat .dl { font-size: 12px; color: var(--muted); line-height: 1; align-self: center; }
.heat i { display: block; border-radius: 3px; background: var(--surface-2); aspect-ratio: 1; width: 100%; }
.heat i.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--surface-2)); }
.heat i.l2 { background: color-mix(in srgb, var(--accent) 55%, var(--surface-2)); }
.heat i.l3 { background: color-mix(in srgb, var(--accent) 80%, var(--surface-2)); }
.heat i.l4 { background: var(--accent); }
.heat i.nil { background: transparent; }
.heat i[data-k] { cursor: pointer; }
.heat i.sel { box-shadow: 0 0 0 1.5px var(--ink); }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.readout { font-size: 13px; color: var(--muted); min-height: 20px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.readout b { color: var(--ink); }
.readout:empty { display: none; }

/* Kayıt satırları */
.entry-list { display: grid; }
.entry { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; padding-block: 10px; border-top: 1px solid var(--line); }
.entry:first-child { border-top: 0; }
.entry .what { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.entry .meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: center; margin-top: 2px; }
.entry .acts { display: flex; gap: 2px; align-items: center; }
.entry .acts button { border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 600; min-height: 44px; min-width: 44px; padding: 0 10px; border-radius: 10px; }
.entry .acts button.more { font-size: 20px; letter-spacing: 1px; }
.entry .acts button.del-yes { color: var(--bad); }
@media (hover: hover) { .entry .acts button:hover { background: var(--surface-2); color: var(--ink); } }
.entry.menu { grid-template-columns: auto minmax(0,1fr); }
.entry.menu .acts { grid-column: 1 / -1; justify-content: flex-end; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.priv { background: var(--warn-bg); color: var(--warn-ink); }
.day-head { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-block: 14px 2px; }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--f-display); font-size: 17px; margin-bottom: 4px; }
.month-nav { display: flex; gap: 6px; align-items: center; }
.month-nav select { width: auto; min-width: 0; flex: 1; }
.month-nav .icon-btn { flex: none; }

/* Salon */
.salon-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .salon-grid { grid-template-columns: minmax(0, 1fr); } }
.av { width: 34px; height: 34px; border-radius: 50%; flex: none; object-fit: cover; background: var(--surface-2); display: inline-grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; }
.av { font-size: 19px; line-height: 1; }
.av.sm { width: 26px; height: 26px; font-size: 14px; }
.av-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.av-opt { height: 44px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; font-size: 22px; line-height: 1; padding: 0; }
.av-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.person.is-off .nm, .person.is-off .elapsed small { color: var(--muted); }
div.person, div.rank-row { cursor: default; }
.person { display: flex; gap: 12px; align-items: center; padding-block: 11px; border-top: 1px solid var(--line); min-width: 0; min-height: 56px; }
.person:first-child { border-top: 0; }
.person .who { min-width: 0; flex: 1; display: block; }
.person .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.person .st { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; min-width: 0; }

// Kronometreli oturumu kaydet: gece yarısını aşıyorsa iki güne bölünür (C3)

  const stD = dkey(new Date(pre.st)), enD = dkey(new Date(pre.en - 1));

function localPending() {

  for (const ym of Object.keys(saved.kron || {})) for (const id of Object.keys(saved.kron[ym] || {})) if (normOwnTimed(id, saved.kron[ym][id])) n++;
  for (const ym of Object.keys(saved.manual || {})) for (const id of Object.keys(saved.manual[ym] || {})) if (normManual(id, saved.manual[ym][id])) n++;
  for (const id of Object.keys(saved.denemeler || {})) if (saved.denemeler[id] && !saved.denemeler[id].del) n++;
  return n ? { saved, n } : null;
}

function renderHeat(timed) {

  const tk = todayKey(), first = firstDayKey();
  const weeksSince = Math.round(daysBetween(mondayOf(first), mondayOf(tk)) / 7) + 1;
  const LABEL_W = window.innerWidth < 360 ? 34 : 74, GAP = 3;
  const avail = Math.max(120, (innerW(panel) || 320) - LABEL_W - GAP);
  const fit = Math.max(1, Math.floor((avail + GAP) / (14 + GAP)));
  const shown = Math.max(1, Math.min(26, fit, weeksSince));
  const cell = Math.max(12, Math.min(16, Math.floor((avail - (shown - 1) * GAP) / shown)));
  const startMon = parseKey(mondayOf(tk)); startMon.setDate(startMon.getDate() - (shown - 1) * 7);
  let activeDays = 0;
  for (const k of Object.keys(byDay)) if (k >= first && byDay[k] > 0) activeDays++;
  let title, sub;
  if (weeksSince <= shown && weeksSince < 26) { title = "Başladığından beri"; sub = `${daysBetween(first, tk) + 1}. gün · ${activeDays} aktif gün`; }
  else if (shown >= 26) { title = "Son 6 ay"; sub = `${activeDays} aktif gün`; }
  else { title = `Son ${shown} hafta`; sub = `${activeDays} aktif gün`; }
  let cellsHTML = `<span></span>`;
  // Ay adı, ayın ilk haftasının sütununda; iki ad üst üste binmesin diye en az 3 sütun arayla
  const colMonth = w => { const d = new Date(startMon); d.setDate(d.getDate() + w * 7 + 6); return d.getMonth(); };
  let prevM = -1, lastLab = -9;
  for (let w = 0; w < shown; w++) {
    const m = colMonth(w);
    let lab = "";
    if (m !== prevM) {
      const roomy = w - lastLab >= 3 && (w > 0 || shown < 3 || colMonth(Math.min(2, shown - 1)) === m);
      if (roomy) { lab = MONTHS_TR[m]; lastLab = w; }
    }
    cellsHTML += `<span class="ml">${lab}</span>`;
    prevM = m;
  }
  for (let r = 0; r < 7; r++) {
    cellsHTML += `<span class="dl">${LABEL_W < 60 ? ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"][r] : ["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"][r]}</span>`;
    for (let w = 0; w < shown; w++) {
      const d = new Date(startMon); d.setDate(d.getDate() + w * 7 + r);
      const k = dkey(d);
      if (k < first || k > tk) { cellsHTML += `<i class="nil"></i>`; continue; }
      const v = byDay[k] || 0;
      const l = v === 0 ? "" : v < 30 ? "l1" : v < 90 ? "l2" : v < 180 ? "l3" : "l4";
      cellsHTML += `<i class="${l}${k === (S.heatSel || tk) ? " sel" : ""}" data-k="${k}" data-v="${v}" title="${esc(niceDay(k))}: ${esc(fmtMin(v))}"></i>`;
    }
  }
  setHTML(panel, `

}
$("heatPanel").addEventListener("click", e => {

// ---------- Kayıt satırları ----------
function entryRow(e, own = true) {
  const parts = [`<span class="chip-s"><span class="tdot t-${e.t}"></span>${esc(TSHORT[e.t])}</span>`];
  if (e.m) parts.push(esc(fmtMin(e.m)));
  if (e.q) parts.push(`${fmtNum(e.q)} soru · ${fmtNum(e.c)}D ${fmtNum(e.w)}Y${pct(e.c, e.q) !== null ? ` · %${pct(e.c, e.q)}` : ""}`);
  if (e.kind === "t" && e.b) parts.push(`${esc(fmtMin(e.b))} mola`);
  if (e.k) parts.push(esc(e.k));
  if (e.n) parts.push(esc(e.n));
  if (e.kind === "m") parts.push(`<span class="tag priv">elle</span>`);
  if (e.kind === "t" && e.unranked) parts.push(`<span class="tag" title="Bu oturum ortak denetimden geçmedi; senin istatistiğinde var, sıralamaya girmedi.">sıralamaya girmedi</span>`);
  const ro = readOnly();
  let acts = "", menu = false;
  if (own && !ro) {
    if (S.confirmDel === e.id) { menu = true; acts = `<span class="small muted" style="margin-right:auto">Kayıt silinsin mi?</span><button type="button" class="del-yes" data-del-yes="${esc(e.id)}">Evet, sil</button><button type="button" data-del-no>Vazgeç</button>`; }
    else if (S.menuFor === e.id) { menu = true; acts = `<button type="button" data-edit="${esc(e.id)}">Düzenle</button><button type="button" data-del="${esc(e.id)}">Sil</button><button type="button" data-menu-close aria-label="Kapat">×</button>`; }
    else acts = `<button type="button" class="more" data-menu="${esc(e.id)}" aria-label="${esc(SUBJ[e.s].n)} kaydı için işlemler">⋯</button>`;
  }
  return `<div class="entry${menu ? " menu" : ""}">${badge(e.s)}
    <div style="min-width:0"><div class="what">${esc(SUBJ[e.s].n)}</div><div class="meta num">${parts.join("<span aria-hidden=\"true\">·</span>")}</div></div>
    ${acts ? `<div class="acts">${acts}</div>` : ""}</div>`;
}
function findMine(id) { return myTimedAll().find(x => x.id === id) || manualAll().find(x => x.id === id) || null; }
document.addEventListener("click", e => {
  if (S.heatSel && !e.target.closest("i[data-k]")) { S.heatSel = null; if (S.tab === "bugun") renderHeat(myTimedAll()); }   // başka yere dokununca bugüne döner
  const g = e.target.closest("[data-go]"); if (g) { go(g.dataset.go); return; }
  if (e.target.closest("[data-open='settings']")) { openSettings(); return; }
  const mn = e.target.closest("[data-menu]"); if (mn) { S.menuFor = mn.dataset.menu; S.confirmDel = null; render(); return; }
  if (e.target.closest("[data-menu-close]")) { S.menuFor = null; render(); return; }
  const ed = e.target.closest("[data-edit]");
  if (ed) { const en = findMine(ed.dataset.edit); S.menuFor = null; if (en) (en.kind === "m" ? openManualForm({ ...en, editing: true }) : openTimedForm({ ...en, editing: true })); return; }
  const dl = e.target.closest("[data-del]"); if (dl) { S.confirmDel = dl.dataset.del; S.menuFor = null; render(); return; }
  if (e.target.closest("[data-del-no]")) { S.confirmDel = null; render(); return; }
  const dy = e.target.closest("[data-del-yes]");
  if (dy) { const en = findMine(dy.dataset.delYes); S.confirmDel = null; if (en && !readOnly()) deleteEntry(en); return; }
  if (e.target.closest("[data-invite]")) { openInvite(); return; }
  if (e.target.closest("[data-room-new]")) { openRoomForm("new"); return; }
  if (e.target.closest("[data-room-join]")) { openRoomForm("join"); return; }
  const rb = e.target.closest("[data-room]"); if (rb) { setActiveRoom(rb.dataset.room); render(); return; }
  const pr = e.target.closest("[data-profile]");
  if (pr) { S.profileId = pr.dataset.profile; renderProfile(); syncLock(); }
});

// ---------- Kayıtlarım (ay ay) ----------
function renderLogs() {
  const months = monthsBetween(firstYm(), todayKey().slice(0, 7)).reverse();
  if (!months.includes(S.logMonth)) S.logMonth = months[0];
  const inMonth = e => e.d.startsWith(S.logMonth);
  const timed = myTimedAll().filter(inMonth), man = manualAll().filter(inMonth);
  let all = S.logKind === "t" ? timed : S.logKind === "m" ? man : [...timed, ...man];
  all = all.filter(e => S.logFilter === "all" || e.s === S.logFilter).sort((a, b) => b.d.localeCompare(a.d) || b.ts - a.ts);
  let html = "", lastDay = null;
  for (const e of all) { if (e.d !== lastDay) { html += `<div class="day-head">${esc(niceDay(e.d))}</div>`; lastDay = e.d; } html += entryRow(e); }
  const at = agg(timed), am = agg(man);
  const idx = months.indexOf(S.logMonth);
  setHTML($("logPanel"), `
    <div class="panel-head"><h2>Kayıtlarım</h2>
      <button class="btn primary sm" type="button" data-act-new${readOnly() ? " disabled" : ""}>Elle kayıt ekle</button></div>
    <div class="stack-gap" style="margin-bottom:12px">
      <div class="month-nav">
        <button class="icon-btn" type="button" data-mnav="older" aria-label="Önceki ay"${idx >= months.length - 1 ? " disabled" : ""}>‹</button>
        <select id="logMonth" aria-label="Ay">${months.map(ym => `<option value="${ym}"${ym === S.logMonth ? " selected" : ""}>${esc(ymLabel(ym))}</option>`).join("")}</select>
        <button class="icon-btn" type="button" data-mnav="newer" aria-label="Sonraki ay"${idx <= 0 ? " disabled" : ""}>›</button>
      </div>
      <select id="logFilter" aria-label="Derse göre süz"><option value="all">Tüm dersler</option>${subjectOptions(S.logFilter)}</select>
      <div class="seg" role="radiogroup" aria-label="Kayıt türü" data-seg="kind">
        ${[["all", "Tümü"], ["t", "Kronometreli"], ["m", "Elle"]].map(([k, l]) => `<button type="button" role="radio" aria-checked="${S.logKind === k}" data-val="${k}">${l}</button>`).join("")}
      </div>
    </div>
    <p class="small muted" style="margin:0 0 6px">${esc(ymLabel(S.logMonth))} — kronometreli: <b class="num">${esc(fmtMin(at.dk))}</b> / <b class="num">${fmtNum(at.q)}</b> soru · elle: <b class="num">${esc(fmtMin(am.dk))}</b> / <b class="num">${fmtNum(am.q)}</b> soru</p>
    ${all.length ? `<div class="entry-list">${html}</div>` : `<div class="empty"><strong>Bu ayda kayıt yok</strong></div>`}`);

$("logPanel").addEventListener("change", e => {

// ---------- Salon ----------
function renderSalon() {
  const rc = myRoomCode(), me = myId();
  const ppl = presentPeople();
  const tot = {};
  for (const p of ppl) tot[p.key] = agg(dayTimed(p.key)).dk + Math.floor(liveMs(p.key, ppl) / 60000);
  ppl.sort((a, b) => (ST_RANK[b.pr.st] - ST_RANK[a.pr.st]) || (tot[b.key] - tot[a.key]) || (b.isMe - a.isMe));
  const canOpen = uid => uid === me || ((rc !== GENEL || S.isOwner) && !!S.roots[uid]);
  const online = ppl.map(p => {
    const pr = p.pr || {};
    const sk = SUBJ[pr.s] ? pr.s : null, ty = TYPES[pr.tt] || null;
    const ms = peerElapsed(p);
    let st = "Çevrimdışı", dotCls = "off", elCls = "";
    if (pr.st === "calisiyor") { st = sk ? `${SUBJ[sk].n}${ty ? " · " + ty : ""}` : "Çalışıyor"; dotCls = ""; }
    else if (pr.st === "mola") { st = `Molada${sk ? " · " + SUBJ[sk].n : ""}`; dotCls = "pause"; elCls = " brk"; }
    else if (pr.st === "online") { st = "Çevrimiçi"; dotCls = "away"; }
    const tag = canOpen(p.key) ? ["button", ` type="button" data-profile="${esc(p.key)}"`] : ["div", ""];
    return `<${tag[0]} class="person${pr.st === "offline" ? " is-off" : ""}"${tag[1]}><span class="av-wrap">${avatarHTML(p.key)}<span class="dot ${dotCls}"></span></span>
      <span class="who"><span class="nm">${esc(person(p.key).name)}${p.isMe ? `<span class="you-tag">sen</span>` : ""}</span><span class="st">${sk && ms !== null ? badge(sk, "sm") : ""}<span>${esc(st)}</span></span></span>
      <span class="elapsed${elCls}">${ms !== null ? esc(fmtMin(ms / 60000)) : ""}<small>bugün ${esc(fmtMin(tot[p.key]))}</small></span></${tag[0]}>`;
  }).join("");
  const studying = ppl.filter(p => p.pr.st === "calisiyor").length;
  const rooms = myRooms();
  const pill = (k, l) => `<button class="pill" type="button" data-room="${esc(k)}" aria-pressed="${k === rc}">${esc(l)}</button>`;
  const switcher = rooms.length ? `<div class="pill-row" role="group" aria-label="Odalar" style="margin-bottom:12px">${pill(GENEL, "Genel")}${rooms.map(l => pill(roomCode(l), l)).join("")}</div>` : "";
  const roomActs = S.mode === "cloud" && !readOnly() ? `<div class="tc-actions" style="justify-content:flex-start;margin:0 0 14px"><button class="btn sm" type="button" data-room-new>Oda kur</button><button class="btn sm" type="button" data-room-join>Odaya katıl</button></div>` : "";
  setHTML($("onlinePanel"), `${switcher}${roomActs}<div class="panel-head"><h2>${rc === GENEL ? "Genel" : esc(myRoomLabel()) + " odası"}</h2><span class="small muted num">${ppl.length} kişi · ${studying} çalışıyor</span></div>${online}
    ${S.mode === "cloud" && !readOnly() ? `<div class="tc-actions" style="justify-content:flex-start"><button class="btn sm" type="button" data-invite>Arkadaş davet et</button></div>` : ""}`);

  const rows = ppl.filter(p => S.roots[p.key] || p.key === me).map(p => {
    const id = p.key, a = agg(dayTimed(id));
    const live = Math.floor(liveMs(id, ppl) / 60000);
    return { id, live, on: p.pr.st !== "offline", v: S.rankMetric === "dk" ? a.dk + live : a.q,
      sub: S.rankMetric === "dk" ? (live ? `${fmtMin(a.dk)} + canlı ${fmtMin(live)}` : `${fmtNum(a.q)} soru`) : (a.q ? `%${pct(a.c, a.q)} doğru` : "") };
  }).filter(r => r.v > 0 || r.id === me).sort((a, b) => b.v - a.v);
  const max = Math.max(1, ...rows.map(r => r.v));
  setHTML($("rankPanel"), `
    <div class="panel-head"><h2>Canlı sıralama</h2>
      <div class="seg two" style="width:200px" role="radiogroup" aria-label="Ölçüt" data-seg="metric">${[["dk", "Süre"], ["q", "Soru"]].map(([k, l]) => `<button type="button" role="radio" aria-checked="${S.rankMetric === k}" data-val="${k}">${l}</button>`).join("")}</div>
    </div>
    ${rows.some(r => r.v > 0) ? rows.map((r, i) => { const tag = canOpen(r.id) ? ["button", ` type="button" data-profile="${esc(r.id)}"`] : ["div", ""]; return `
      <${tag[0]} class="rank-row${r.id === me ? " me" : ""}"${tag[1]}>
        <span class="pos">${r.v > 0 ? i + 1 : "–"}</span>
        <span class="av-wrap">${avatarHTML(r.id, "sm")}${r.on ? `<span class="dot" style="width:9px;height:9px"></span>` : ""}</span>
        <span style="min-width:0;display:block"><span style="display:flex;align-items:center;gap:6px;min-width:0"><span style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">${esc(person(r.id).name)}</span>${r.live ? `<span class="tag live-tag" style="margin:0;flex:none">canlı</span>` : ""}</span><span class="bar" style="display:block"><i style="width:${Math.round(r.v / max * 100)}%${S.rankMetric === "q" ? ";background:var(--soru)" : ""}"></i></span></span>
        <span style="text-align:right;display:block"><span class="val">${S.rankMetric === "dk" ? esc(fmtMin(r.v)) : fmtNum(r.v)}</span><span class="small muted num" style="display:block">${esc(r.sub)}</span></span>
      </${tag[0]}>`; }).join("") : `<div class="empty"><strong>Bugün henüz kimse çalışmadı</strong></div>`}
`);
}

  const b = e.target.closest("[data-seg='metric'] button"); if (!b) return;
  S.rankMetric = b.dataset.val; renderSalon();
});

        <div class="tile"><div class="l"><span class="tdot t-konu"></span>Konu</div><div class="v">${esc(fmtMin(tot.konu))}</div><div class="s">${tot.konuN} oturum</div></div>

// ---------- Grafikler (kutu genişliğine göre çizilir) ----------
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function stackedChart(id, buckets, series, opts) {
  const n = Math.max(1, buckets.length);
  const minSlot = 20;
  const W = Math.max(Math.round(opts.width || 600), 48 + n * minSlot);
  const H = 200, L = 44, R = 6, T = 10, B = 26;
  const totals = buckets.map((_, i) => series.reduce((x, s) => x + s.values[i], 0));
  const maxT = Math.max(...totals, 0);
  const step = maxT > 0 ? niceStep(maxT / 4) : 1;
  const top = maxT > 0 ? Math.ceil(maxT / step) * step : 4;
  const y = v => T + (H - T - B) * (1 - v / top);
  const slot = (W - L - R) / n, bw = Math.max(4, Math.min(28, slot * 0.62));
  const every = Math.max(1, Math.ceil(34 / slot));
  let g = "";
  for (let v = 0; v <= top + 1e-9; v += step) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${esc(opts.fmt(v))}</text>`;
  }
  buckets.forEach((b, i) => {
    const x = L + slot * i + (slot - bw) / 2;
    let acc = 0;
    for (const s of series) {
      const v = s.values[i]; if (!v) continue;
      const y1 = y(acc + v), y0 = y(acc);
      g += `<rect data-i="${i}" x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, y0 - y1).toFixed(1)}" rx="2" style="fill:${s.color};stroke:var(--surface);stroke-width:1"></rect>`;
      acc += v;
    }
    g += `<rect data-i="${i}" x="${(L + slot * i).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${H - T}" fill="transparent"></rect>`;
    const isLast = i === n - 1;
    if ((n - 1 - i) % every === 0) g += `<text x="${(L + slot * i + slot / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle"${isLast ? ` style="fill:var(--ink);font-weight:600"` : ""}>${esc(b.lab)}</text>`;
  });
  return `<div class="chart-box" data-chart="${id}"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria)}">${g}</svg></div><div class="readout" id="read-${id}"></div>`;
}
function chartReadout(id, buckets, series, fmtVal) {
  const box = document.querySelector(`[data-chart="${id}"]`); if (!box) return;
  if (box.scrollWidth > box.clientWidth) box.scrollLeft = box.scrollWidth;   // en yeni dönem görünsün
  box.addEventListener("click", e => {
    const r = e.target.closest("rect[data-i]"); if (!r) return;
    const i = +r.dataset.i, b = buckets[i];
    const parts = series.filter(s => s.values[i] > 0).map(s => `${esc(s.label)} ${esc(fmtVal(s.values[i]))}`);
    const out = $("read-" + id); if (!out) return;
    out.innerHTML = `<b>${esc(b.long)}</b> · ${parts.length ? parts.join(" · ") : "kayıt yok"}`;
  });
}
function sheetChartWidth() { const vw = window.innerWidth; return vw <= 760 ? vw - 34 : Math.min(860, vw - 32) - 58; }

function sheetShell(id, titleHTML, bodyHTML, footHTML, cls = "") {

    <div class="sheet-body">${bodyHTML}</div>${footHTML ? `<div class="sheet-foot">${footHTML}</div>` : ""}</div>`;
}
function keepScroll(ov, html, after) {

}

  const body = `

// ---------- Profil: oda arkadaşının son 10 günü (B3) ----------
function renderProfile() {
  const ov = $("profileOverlay");
  const uid = S.profileId;
  const full = !!uid && canSeeHistory(uid) && (uid === myId() || !!S.roots[uid]);
  const limited = !!uid && !full && S.isOwner && !!S.roots[uid];       // sayfa sahibi: yalnızca listeden çıkarma
  if (!full && !limited) { if (!ov.hidden) { ov.hidden = true; ov.innerHTML = ""; ov.__h = null; releaseFocus(); } return; }
  const son = sonOf(uid), ppl = presentPeople();
  const live = Math.floor(liveMs(uid, ppl) / 60000);
  const tk = todayKey();
  const days = []; for (let i = SHARE_DAYS - 1; i >= 0; i--) days.push(agoKey(i));
  let tot = { m: 0, q: 0, c: 0, w: 0 }, worked = 0;
  const subj = {};
  for (const d of days) {
    const r = son[d]; if (!r) continue;
    tot.m += r.m; tot.q += r.q; tot.c += r.c; tot.w += r.w;
    if (r.m > 0) worked++;
    for (const k of Object.keys(r.s)) { const o = subj[k] || (subj[k] = { m: 0, q: 0, c: 0, w: 0 }); o.m += r.s[k].m; o.q += r.s[k].q; o.c += r.s[k].c; o.w += r.s[k].w; }
  }
  const todayM = (son[tk] ? son[tk].m : 0) + live;
  if (live && !(son[tk] && son[tk].m)) worked++;
  const p = ppl.find(x => x.key === uid);
  let status = "Çevrimdışı";
  if (p) {
    const s = SUBJ[p.pr.s] ? SUBJ[p.pr.s].n : null;
    status = p.pr.st === "calisiyor" ? `Çalışıyor${s ? " · " + s : ""}` : p.pr.st === "mola" ? `Molada${s ? " · " + s : ""}` : p.pr.st === "online" ? "Çevrimiçi" : "Çevrimdışı";
  }
  // 10 günlük çubuk grafik
  const W = sheetChartWidth(), H = 150, L = 4, R = 4, T = 8, B = 24;
  const vals = days.map(d => (son[d] ? son[d].m : 0) + (d === tk ? live : 0));
  const vmax = Math.max(60, ...vals);
  const slot = (W - L - R) / days.length, bw = Math.min(30, slot * 0.6);
  let g = "";
  g += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/>`;
  days.forEach((d, i) => {
    const v = vals[i], h = v ? Math.max(3, (H - T - B) * v / vmax) : 0, x = L + slot * i + (slot - bw) / 2;
    if (h) g += `<rect data-i="${i}" x="${x.toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" style="fill:var(--accent)"></rect>`;
    g += `<rect data-i="${i}" x="${(L + slot * i).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${H}" fill="transparent"></rect>`;
    const dd = parseKey(d);
    g += `<text x="${(L + slot * i + slot / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle"${d === tk ? ` style="fill:var(--ink);font-weight:600"` : ""}>${d === tk ? "Bgn" : DAYS_SHORT[dd.getDay()]}</text>`;
  });
  const chart = `<div class="chart-box" data-chart="p10"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Son 10 günün çalışma süresi">${g}</svg></div><div class="readout" id="read-p10"></div>`;
  const sRows = Object.entries(subj).filter(([, v]) => v.m || v.q).sort((a, b) => b[1].m - a[1].m);
  const smax = Math.max(1, ...sRows.map(([, v]) => v.m));
  const subjHTML = sRows.length ? `<div class="dist">${sRows.map(([k, v]) => `<div class="r" style="--c:var(--d-${k})"><span class="lab">${badge(k, "sm")}<span>${esc(SUBJ[k].n)}</span></span><span class="trk"><i style="width:${Math.max(2, Math.round(v.m / smax * 100))}%"></i></span><span class="val">${esc(fmtMin(v.m))}${v.q ? ` · ${fmtNum(v.q)} s` : ""}</span></div>`).join("")}</div>`
    : `<p class="muted small" style="margin:0">Son 10 günde kaydedilmiş oturum yok.</p>`;
  const dayList = days.slice().reverse().map(d => {
    const r = son[d], m = (r ? r.m : 0) + (d === tk ? live : 0);
    const chips = r ? Object.entries(r.s).sort((a, b) => b[1].m - a[1].m).map(([k, v]) => `<span class="chip-s">${badge(k, "sm")}${esc(SUBJ[k].n)} <span class="muted">${esc(fmtMin(v.m))}</span></span>`).join("") : "";
    return `<div class="pday${m ? "" : " zero"}"><span class="dn">${esc(niceDay(d).split(" · ")[0] === "Bugün" || niceDay(d).startsWith("Dün") ? niceDay(d).split(" · ")[0] + " · " + shortDay(d) : niceDay(d))}</span>
      <span class="dv">${m ? esc(fmtMin(m)) : "0 dk"}${r && r.q ? ` · ${fmtNum(r.q)} soru${pct(r.c, r.q) !== null ? ` · %${pct(r.c, r.q)}` : ""}` : ""}</span>
      ${chips || (d === tk && live) ? `<span class="ds">${chips}${d === tk && live ? `<span class="chip-s"><span class="tag live-tag">canlı</span> ${esc(fmtMin(live))}</span>` : ""}</span>` : ""}</div>`;
  }).join("");
  const title = `<div style="display:flex;gap:12px;align-items:center;min-width:0;flex:1">${avatarHTML(uid)}
      <div style="min-width:0"><h2 id="profTitle">${esc(person(uid).name)}${uid === myId() ? `<span class="you-tag">sen</span>` : ""}</h2>
      <div class="small muted">${esc(status)} · <span class="room-chip">${myRoomCode() === GENEL ? "Genel" : esc(myRoomLabel()) + " odası"}</span></div></div></div>
    <button class="close" type="button" data-close-prof aria-label="Kapat">×</button>`;
  const kick = S.isOwner && S.mode === "cloud" && uid !== myId()
    ? (S.confirmKick === uid
      ? `<span class="small muted" style="margin-right:auto;align-self:center">Listelerden çıkar ve yeniden katılamaz.</span><button class="btn danger" type="button" data-kick-yes>Evet, çıkar</button><button class="btn" type="button" data-kick-no>Vazgeç</button>`
      : `<button class="btn danger" type="button" data-kick>Listeden çıkar</button>`) : "";
  const body = limited ? `
    <div class="tiles"><div class="tile"><div class="l">Bugün</div><div class="v">${esc(fmtMin(agg(dayTimed(uid)).dk + live))}</div></div></div>` : `
    <div class="tiles">
      <div class="tile"><div class="l">Bugün</div><div class="v">${esc(fmtMin(todayM))}</div><div class="s">${live ? `canlı ${esc(fmtMin(live))} dahil` : (son[tk] && son[tk].q ? `${fmtNum(son[tk].q)} soru` : "–")}</div></div>
      <div class="tile"><div class="l">Son 10 gün</div><div class="v">${esc(fmtMin(tot.m + live))}</div><div class="s">${tot.q ? `${fmtNum(tot.q)} soru` : "–"}</div></div>
      <div class="tile"><div class="l">Günlük ortalama</div><div class="v">${esc(fmtMin((tot.m + live) / SHARE_DAYS))}</div></div>
      <div class="tile"><div class="l">Çalışılan gün</div><div class="v num">${worked}/${SHARE_DAYS}</div><div class="s">${tot.q ? `%${pct(tot.c, tot.q)} doğru` : ""}</div></div>
    </div>
    <div><h3 class="sec-title" style="margin-bottom:6px">Son 10 gün</h3>${chart}</div>
    <div><h3 class="sec-title" style="margin-bottom:8px">Son 10 günde dersler</h3>${subjHTML}</div>
    <div><h3 class="sec-title" style="margin-bottom:2px">Gün gün</h3><div>${dayList}</div></div>
`;
  const first = ov.hidden;
  keepScroll(ov, sheetShell("profTitle", title, body, kick, limited ? "narrow" : ""), () => {
    const box = ov.querySelector('[data-chart="p10"]');
    if (box) box.addEventListener("click", ev => {
      const r = ev.target.closest("rect[data-i]"); if (!r) return;
      const d = days[+r.dataset.i], s = son[d], out = $("read-p10"); if (!out) return;
      const m = (s ? s.m : 0) + (d === tk ? live : 0);
      const parts = s ? Object.entries(s.s).sort((a, b) => b[1].m - a[1].m).map(([k, v]) => `${esc(SUBJ[k].n)} ${esc(fmtMin(v.m))}`) : [];
      out.innerHTML = `<b>${esc(niceDay(d))}</b> · ${esc(fmtMin(m))}${s && s.q ? ` · ${fmtNum(s.q)} soru` : ""}${parts.length ? " — " + parts.join(" · ") : ""}`;
    });
  });
  ov.hidden = false;
  if (first) captureFocus(ov);
}
$("profileOverlay").addEventListener("click", e => {
  if (e.target === e.currentTarget || e.target.closest("[data-close-prof]")) { S.profileId = null; S.confirmKick = null; renderProfile(); syncLock(); return; }
  if (e.target.closest("[data-kick-yes]")) { kickUser(S.profileId); return; }
  if (e.target.closest("[data-kick-no]")) { S.confirmKick = null; renderProfile(); return; }
  if (e.target.closest("[data-kick]")) { S.confirmKick = S.profileId; renderProfile(); }
});
// Sayfa sahibi, erişimini kaldırdığı kişiyi listelerden de çıkarır (ortak kaydı silinir; kişinin özel kayıtlarına dokunulmaz)
function kickUser(uid) {
  if (!S.isOwner || S.mode !== "cloud" || !uid || uid === myId()) return;
  const roots = { ...S.roots }; delete roots[uid]; S.roots = roots;
  const path = `logs/${uid}`;
  enqueue(path, () => db.doc(path).delete());
  S.confirmKick = null; S.profileId = null; render(); syncLock();
  toast("Listeden çıkarıldı.");

    const td = clampNum(v.td, 0, 300), ty = clampNum(v.ty, 0, 300), kd = clampNum(v.kd, 0, 300), ky = clampNum(v.ky, 0, 300);
    out.push({ id, n: typeof v.n === "string" ? v.n.slice(0, 60) : "Deneme", d: v.d, td, ty, kd, ky, tNet: netOf(td, ty), kNet: netOf(kd, ky), ts: clampNum(v.ts, 0, 9e15) });

let focusRelease = null;
function captureFocus(container) {
  releaseFocus();
  const prev = document.activeElement;
  const sel = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
  const onKey = e => {
    if (e.key !== "Tab") return;
    const items = [...container.querySelectorAll(sel)].filter(el => !el.disabled && el.offsetParent !== null);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  // Telefonda giriş alanına dokunduğunda klavyenin üstünde kalsın
  const onFocusIn = e => {
    if (!coarse() || !e.target.matches("input, select, textarea")) return;
    setTimeout(() => { try { e.target.scrollIntoView({ block: "center", behavior: "smooth" }); } catch {} }, 280);
  };
  container.addEventListener("keydown", onKey);
  container.addEventListener("focusin", onFocusIn);
  setTimeout(() => {
    const sheet = container.querySelector(".sheet");
    // Dokunmatik cihazda klavye kendiliğinden açılmasın: odak pencerenin kendisine
    const f = coarse() ? sheet : (container.querySelector('.sheet-body input:not([type="hidden"]):not([type="checkbox"]), .sheet-body select, .sheet-body textarea') || sheet);
    if (f) { try { f.focus({ preventScroll: true }); } catch { f.focus(); } }
  }, 0);
  focusRelease = () => {
    container.removeEventListener("keydown", onKey);
    container.removeEventListener("focusin", onFocusIn);
    if (prev && prev.focus && document.contains(prev)) { try { prev.focus({ preventScroll: true }); } catch {} }
  };
}
function releaseFocus() { if (focusRelease) { const f = focusRelease; focusRelease = null; f(); } }
function closeModal() { const m = $("modalOverlay"); m.hidden = true; m.innerHTML = ""; m.__h = null; releaseFocus(); syncLock(); }
function openModal(html) {
  const m = $("modalOverlay");
  m.innerHTML = html; m.__h = null; m.hidden = false;
  syncLock();
  captureFocus(m);
}
function formShell(id, titleId, title, body, foot) {

    <div class="sheet-head"><span class="grab" aria-hidden="true"></span><h2 id="${titleId}">${title}</h2><button class="close" type="button" data-close-modal aria-label="Kapat">×</button></div>

}

function copyText(text, inp, okMsg) {

(() => {

    d = { sheet, y: e.touches[0].clientY, x: e.touches[0].clientX, dy: 0, on: false };
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!d || e.touches.length !== 1) return;
    const dy = e.touches[0].clientY - d.y, dx = e.touches[0].clientX - d.x;
    if (!d.on) {

    e.preventDefault();
  }, { passive: false });
  const end = () => {
    if (!d) return;

    if (!on) return;

// Var olan kayıtlara dokunmaz; yalnızca yedekte olup hesapta olmayanları ekler.
function importBackup(obj) {
  if (!obj || typeof obj !== "object" || obj.uygulama !== "TusDostum") throw new Error("yedek değil");
  const add = { kron: {}, elle: {} }; let n = 0;
  const take = (list, kind, norm, cur) => {
    for (const raw of Array.isArray(list) ? list : []) {
      if (!raw || typeof raw !== "object" || raw.id == null) continue;
      const { id, kind: _k, unranked: _u, ...body } = raw;
      const e = norm(id, body); if (!e) continue;
      const ym = e.d.slice(0, 7), key = String(id);
      if ((cur[ym] || {})[key] || (add[kind][ym] || {})[key]) continue;
      (add[kind][ym] || (add[kind][ym] = {}))[key] = body; n++;
    }
  };
  take(obj.kronometreli, "kron", normOwnTimed, S.kron);
  take(obj.elle, "elle", normManual, S.manual);
  const den = {};
  for (const raw of Array.isArray(obj.denemeler) ? obj.denemeler : []) {
    if (!raw || typeof raw !== "object" || raw.id == null || !isDateStr(raw.d) || S.denemeler[raw.id]) continue;
    den[String(raw.id)] = { n: typeof raw.n === "string" ? raw.n.slice(0, 60) : "Deneme", d: raw.d, td: clampNum(raw.td, 0, 300), ty: clampNum(raw.ty, 0, 300), kd: clampNum(raw.kd, 0, 300), ky: clampNum(raw.ky, 0, 300), ts: clampNum(raw.ts, 0, 9e15) || Date.now() };
    n++;
  }
  for (const kind of ["kron", "elle"]) for (const ym of Object.keys(add[kind])) {
    const ents = add[kind][ym];
    if (kind === "kron") S.kron = { ...S.kron, [ym]: { ...(S.kron[ym] || {}), ...ents } };
    else S.manual = { ...S.manual, [ym]: { ...(S.manual[ym] || {}), ...ents } };
    if (S.mode === "cloud") privUpsert(`${kind}-${ym}`, { entries: ents }, { ym, entries: ents });
  }
  if (Object.keys(den).length) {
    S.denemeler = { ...S.denemeler, ...den };
    if (S.mode === "cloud") privUpsert("denemeler", { items: den }, { items: den });
  }
  // Ayarlar: yalnızca boş olanlar doldurulur
  const a = obj.ayarlar && typeof obj.ayarlar === "object" ? obj.ayarlar : {}, patch = {};
  for (const k of ["goalMin", "goalQ", "examDate", "breakWarn", "workWarn"]) if (a[k] != null && a[k] !== "" && (S.settings[k] == null || S.settings[k] === "")) patch[k] = a[k];
  if (Object.keys(patch).length) writeSettings(patch);
  if (S.mode !== "cloud") persistLocal();
  return n;
}
function restoreFromFile(file) {
  if (readOnly()) return;

  };

  r.readAsText(file);
}

    if (e.target.closest("#aForgot")) {
      const m = mailVal();
      if (!m) { fail("Önce e-postanı yaz."); return; }
      busy = true;
      try { await A.sifreSifirla(m); $("aErr").textContent = ""; $("aInfo").textContent = "Sıfırlama bağlantısı e-postana gönderildi."; }
      catch (x) { fail(x.message); }
      busy = false;
    }
  };
  el.onsubmit = async e => {
    e.preventDefault();
    if (busy) return;
    const m = mailVal(), p = $("aPass").value || "";
    if (!m || !/.+@.+\..+/.test(m)) { fail("Geçerli bir e-posta yaz."); return; }
    if (p.length < 6) { fail("Şifre en az 6 karakter olmalı."); return; }
    busy = true; $("aGo").disabled = true; $("aErr").textContent = "";
    try {
      await (mode === "giris" ? A.girisYap(m, p) : A.kayitOl(m, p));
      el.remove();
      await bootCloud();
      render(); renderTimerCard();
    } catch (x) {
      busy = false;
      if (x && x.code === "onay") { mode = "giris"; draw(x.message, "", m); }
      else { if ($("aGo")) $("aGo").disabled = false; fail((x && x.message) || "İşlem yapılamadı."); }
    }
  };
}
// Şifre sıfırlama bağlantısından gelindiğinde yeni şifre sorulur
function openNewPass() {
  if ($("npForm")) return;
  openModal(formShell("npForm", "npTitle", "Yeni şifre",
    `<label class="field">Yeni şifre<input type="password" id="npPass" autocomplete="new-password"></label><div class="err" id="npErr" role="alert"></div>`,
    `<button class="btn primary" type="submit">Kaydet</button>`));
  $("npForm").addEventListener("submit", async e => {
    e.preventDefault();
    const p = $("npPass").value || "";
    if (p.length < 6) { $("npErr").textContent = "Şifre en az 6 karakter olmalı."; return; }
    try { await window.TusAltyapi.yeniSifre(p); closeModal(); toast("Şifren değişti."); }
    catch (x) { $("npErr").textContent = (x && x.message) || "İşlem yapılamadı."; }
  });
}

boot();
})();
</script>
